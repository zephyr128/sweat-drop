# Supabase configuration
# This config is used for both local development and remote deployment

[auth]
enabled = true
site_url = "https://www.sweat-drop.com"
additional_redirect_urls = [
  "exp://localhost:8081",
  "sweatdrop://",
  "sweatdrop://auth/confirm",
  "https://www.sweat-drop.com/auth/confirm",
  "https://www.sweat-drop.com/auth/reset",
  "https://admin.sweat-drop.com/auth/confirm",
  "https://admin.sweat-drop.com/auth/reset",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your SweatDrop email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your SweatDrop password"
content_path = "./supabase/templates/reset_password.html"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
ip_version = "IPv4"

# Edge Functions
#
# `delete-account` is invoked from the mobile app with the end-user's Bearer
# JWT. The production project uses asymmetric (ES256) signing keys for user
# tokens, which the Edge Functions gateway currently rejects with
# `UNAUTHORIZED_UNSUPPORTED_TOKEN_ALGORITHM`. We disable gateway-level JWT
# verification here and rely on the function body itself to validate the
# caller via `userClient.auth.getUser()` (GoTrue knows how to verify its own
# signing keys regardless of algorithm). Security posture is preserved — the
# function still rejects missing/invalid tokens with 401 and only ever deletes
# the authenticated user's own data.
[functions.delete-account]
verify_jwt = false
