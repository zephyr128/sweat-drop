# Supabase configuration
# This config is used for both local development and remote deployment

[auth]
enabled = true
site_url = "https://www.sweat-drop.com"
additional_redirect_urls = [
  "exp://localhost:8081",
  "sweatdrop://",
  "sweatdrop://auth/confirm",
  "https://www.sweat-drop.com/auth/confirm",
  "https://www.sweat-drop.com/auth/reset",
  "https://admin.sweat-drop.com/auth/confirm",
  "https://admin.sweat-drop.com/auth/reset",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your SweatDrop email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your SweatDrop password"
content_path = "./supabase/templates/reset_password.html"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
ip_version = "IPv4"
